services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY in .env}
      PORT: 8788
      # rate limits are per client ip, which only works behind the reverse proxy below
      TRUST_PROXY: '1'
    # bound to loopback; terminate TLS with the reverse proxy in front of it
    ports:
      - '127.0.0.1:8788:8788'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
