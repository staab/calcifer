name: Server image

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'server/**'
      - '.github/workflows/server-image.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr

      # built and tested locally first, so a broken image is never pushed
      - uses: docker/build-push-action@v7
        with:
          context: ./server
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          status() {
            curl -s -o /dev/null -w '%{http_code}' "$@"
          }
          expect() {
            [ "$2" = "$3" ] || { echo "$1: expected $3, got $2"; exit 1; }
          }

          docker run -d --rm --name api -p 8788:8788 -e TYPESAFE_API_KEY=ci-dummy "$IMAGE:ci"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/health >/dev/null 2>&1 && break
            sleep 1
          done

          expect health "$(status http://127.0.0.1:8788/health)" 200
          expect unknown-route "$(status -X POST http://127.0.0.1:8788/v1/nope -d '{}')" 404
          expect missing-title "$(status -X POST http://127.0.0.1:8788/v1/meal/macros \
            -H 'Content-Type: application/json' -d '{}')" 400
          # the key is a dummy, so a well-formed request must fail upstream, not succeed
          expect dummy-key "$(status -X POST http://127.0.0.1:8788/v1/meal/macros \
            -H 'Content-Type: application/json' -d '{"title":"toast"}')" 422
          docker stop api

          # the guard must stop the container starting at all: exit 1, not a hang
          set +e
          timeout 30 docker run --rm -e TYPESAFE_API_KEY= "$IMAGE:ci"
          guard=$?
          set -e
          expect key-guard "$guard" 1

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
